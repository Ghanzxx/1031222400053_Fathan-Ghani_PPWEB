<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Mahasiswa</title>
</head>
<body>

    <h1>Form Pendaftaran Mahasiswa</h1>

    <form action="#" method="post">

        <!-- Nama -->
        <label for="nama">Nama:</label><br>
        <input type="text" id="nama" name="nama" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required>
        <br><br>

        <!-- Jenis Kelamin -->
        <label>Jenis Kelamin:</label><br>

        <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki">
        <label for="laki">Laki-laki</label>

        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
        <label for="perempuan">Perempuan</label>
        <br><br>

        <!-- Hobi -->
        <label>Hobi:</label><br>

        <input type="checkbox" id="membaca" name="hobi" value="Membaca">
        <label for="membaca">Membaca</label>

        <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
        <label for="olahraga">Olahraga</label>

        <input type="checkbox" id="gaming" name="hobi" value="Gaming">
        <label for="gaming">Gaming</label>
        <br><br>

        <!-- Pendidikan -->
        <label for="pendidikan">Pendidikan:</label><br>
        <select id="pendidikan" name="pendidikan">
            <option value="">-- Pilih Pendidikan --</option>
            <option value="SMA">SMA</option>
            <option value="SMK">SMK</option>
            <option value="D3">D3</option>
            <option value="S1">S1</option>
            <option value="S2">S2</option>
        </select>
        <br><br>

        <!-- Kritik dan Saran -->
        <label for="kritik">Kritik dan Saran:</label><br>
        <textarea id="kritik" name="kritik" rows="5" cols="40"
                  placeholder="Tuliskan kritik dan saran..."></textarea>
        <br><br>

        <!-- Submit -->
        <input type="submit" value="Daftar">

    </form>

</body>
</html>
